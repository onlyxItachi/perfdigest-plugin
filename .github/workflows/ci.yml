name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.10.11'
          python-version: '3.12'
      - run: npm ci
      - name: Pin the Python tool used by uvx and pre-cache PerfDigest MCP 1.3.0
        # PerfDigest 1.2.0 uses FastMCP; its published mcp>=1.2 range also admits incompatible MCP 2.x.
        # Pre-caching 1.3.0 in $HOME/.cache/uv allows test/mcp-reuse.test.ts (under childEnvironment()) to verify both 1.2.0 and 1.3.0 offline.
        run: |
          uv tool install perfdigest-mcp==1.2.0 --with mcp==1.27.2
          UV_CACHE_DIR="$HOME/.cache/uv" uv tool run --from perfdigest-mcp==1.3.0 python -c "import perfdigest"
      - name: Go unit tests, cross-platform binary build matrix, TypeScript 6 build, and network-mocked contract tests
        run: go test ./... && node scripts/build-go.mjs --verify-cross && npm run build && npm test
      - name: Checkout PerfDigest-MCP-Bench and run cross-repo schema & real-workload regression suite
        run: |
          git clone --depth 1 https://github.com/onlyxItachi/PerfDigest-MCP-Bench.git work/PerfDigest-MCP-Bench
          node scripts/check-bench-regression.mjs --bench-dir work/PerfDigest-MCP-Bench
      - name: Real local MCP, CPU capture and independent verification
        run: npm run test:local
      - name: Real evidence through loopback Decisions HTTP and isolated Codex SDK orchestration
        run: npm run test:decisions-http
      - name: Pack, clean install, demo and MCP discovery
        run: npm run test:package
      - name: Controlled raw/digest/fixture comparison without model access
        run: npm run benchmark:evidence -- --trials 1
      - name: Confirm live API test stays disabled
        env:
          PERFDIGEST_RUN_LIVE_DECISIONS: '0'
        run: npm run test:decisions-live
      - name: Confirm external authentication diagnostic stays disabled
        env:
          PERFDIGEST_RUN_AUTH_BOUNDARY: '0'
        run: npm run test:decisions-auth-boundary
      - name: Confirm hosted Clef integration stays opt-in
        env:
          PERFDIGEST_RUN_CLEF_INTEGRATION: '0'
        run: npm run test:clef-live
      - name: Validate benchmark schemas, committed results and smoke harness
        run: |
          npm run test:bench-integrity
          node bench/schema/build-schema.mjs --check
          node bench/validate.mjs
          node bench/run-matrix.mjs --smoke
